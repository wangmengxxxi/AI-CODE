<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>简易计算器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="calculator">
    <input type="text" id="display" readonly>
    <div id="buttons">
      <button onclick="input('C')">C</button><button onclick="input('/')">÷</button><button onclick="input('*')">×</button><button onclick="input('-')">−</button>
      <button onclick="input('7')">7</button><button onclick="input('8')">8</button><button onclick="input('9')">9</button><button onclick="input('+')">+</button>
      <button onclick="input('4')">4</button><button onclick="input('5')">5</button><button onclick="input('6')">6</button><button rowspan="2" onclick="calculate()">=</button>
      <button onclick="input('1')">1</button><button onclick="input('2')">2</button><button onclick="input('3')">3</button>
      <button onclick="input('0')">0</button><button onclick="input('.')">.</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
