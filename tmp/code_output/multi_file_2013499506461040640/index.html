<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务记录网站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>任务记录网站</h1>
            <p>管理您的日常任务，提高工作效率</p>
        </header>

        <main>
            <section class="task-form-section">
                <div class="form-container">
                    <h2 id="form-title">添加新任务</h2>
                    <form id="task-form">
                        <input type="hidden" id="task-id">
                        <div class="form-group">
                            <label for="task-title">任务标题 *</label>
                            <input type="text" id="task-title" placeholder="请输入任务标题" required>
                        </div>
                        <div class="form-group">
                            <label for="task-description">任务描述</label>
                            <textarea id="task-description" rows="3" placeholder="请输入任务详细描述"></textarea>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="task-priority">优先级</label>
                                <select id="task-priority">
                                    <option value="low">低</option>
                                    <option value="medium" selected>中</option>
                                    <option value="high">高</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="task-due-date">截止日期</label>
                                <input type="date" id="task-due-date">
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="button" id="cancel-btn" class="btn btn-secondary">取消</button>
                            <button type="submit" id="save-btn" class="btn btn-primary">保存任务</button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="task-filters-section">
                <div class="filters-container">
                    <div class="search-filter">
                        <input type="text" id="search-input" placeholder="搜索任务...">
                        <select id="priority-filter">
                            <option value="">所有优先级</option>
                            <option value="high">高优先级</option>
                            <option value="medium">中优先级</option>
                            <option value="low">低优先级</option>
                        </select>
                        <select id="status-filter">
                            <option value="">所有状态</option>
                            <option value="pending">待处理</option>
                            <option value="in-progress">进行中</option>
                            <option value="completed">已完成</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="tasks-section">
                <div class="tasks-header">
                    <h2>我的任务</h2>
                    <div class="tasks-stats">
                        <span id="total-tasks">共 0 项</span>
                    </div>
                </div>
                <div id="tasks-list" class="tasks-list">
                    <!-- 任务项将通过 JavaScript 动态生成 -->
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" width="48" height="48">
                            <path fill="#ccc" d="M19,3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3M19,5V19H5V5H19Z" />
                            <path fill="#ccc" d="M17,11H7V9H17V11M17,15H7V13H17V15Z" />
                        </svg>
                        <p>暂无任务，添加一个新任务开始吧！</p>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 任务记录网站. 保留所有权利.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
