<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>王孟熙 & 李怡霖 · 约会日记</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <h1>✨ 王孟熙 & 李怡霖</h1>
    <p class="subtitle">我们的每一刻，都值得被记住</p>
  </header>

  <main class="container">
    <section class="add-section">
      <h2>📝 记录新约会</h2>
      <form id="diary-form">
        <div class="form-group">
          <label for="date">约会日期</label>
          <input type="date" id="date" required />
        </div>
        <div class="form-group">
          <label for="title">标题（例如：初雪下的咖啡馆）</label>
          <input type="text" id="title" placeholder="给这一天起个名字吧～" maxlength="50" required />
        </div>
        <div class="form-group">
          <label for="content">日记内容</label>
          <textarea id="content" rows="4" placeholder="今天发生了什么？心跳加速的瞬间？小细节也请告诉我呀～" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">💾 保存日记</button>
      </form>
    </section>

    <section class="diary-list">
      <h2>📖 已记录的约会</h2>
      <div id="diary-cards"></div>
      <p id="empty-state" class="empty-text">还没有约会日记哦～快写下你们的第一个故事吧！</p>
    </section>
  </main>

  <footer class="footer">
    <p>© 2024 王孟熙 & 李怡霖 · 用代码写的情书</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
