<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务记录网站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>任务记录管理</h1>
            <p>高效管理您的日常任务</p>
        </header>

        <main>
            <section class="task-form-section">
                <h2 id="form-title">添加新任务</h2>
                <form id="taskForm">
                    <input type="hidden" id="taskId">
                    <div class="form-group">
                        <label for="taskTitle">任务标题 *</label>
                        <input type="text" id="taskTitle" placeholder="请输入任务标题" required>
                    </div>
                    <div class="form-group">
                        <label for="taskDescription">任务描述</label>
                        <textarea id="taskDescription" placeholder="请输入任务详细描述"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="taskPriority">优先级</label>
                            <select id="taskPriority">
                                <option value="low">低</option>
                                <option value="medium" selected>中</option>
                                <option value="high">高</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="taskDueDate">截止日期</label>
                            <input type="date" id="taskDueDate">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" id="cancelBtn" class="btn btn-secondary">取消</button>
                        <button type="submit" id="saveBtn" class="btn btn-primary">保存任务</button>
                    </div>
                </form>
            </section>

            <section class="task-filters-section">
                <div class="filters">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="搜索任务...">
                        <span class="search-icon">🔍</span>
                    </div>
                    <div class="filter-group">
                        <label>状态:</label>
                        <button class="filter-btn active" data-status="all">全部</button>
                        <button class="filter-btn" data-status="pending">待办</button>
                        <button class="filter-btn" data-status="in-progress">进行中</button>
                        <button class="filter-btn" data-status="completed">已完成</button>
                    </div>
                </div>
            </section>

            <section class="tasks-section">
                <div class="tasks-header">
                    <h2>我的任务</h2>
                    <div class="tasks-count">
                        <span id="totalTasks">0</span> 个任务
                    </div>
                </div>
                <div id="tasksList" class="tasks-list">
                    <!-- 任务项将通过JavaScript动态生成 -->
                    <div class="empty-state">
                        <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHZpZXdCb3g9IjAgMCA2NCA2NCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGNpcmNsZSBjeD0iMzIiIGN5PSIzMiIgcj0iMzAiIGZpbGw9IiNmMGYxZjMiIHN0cm9rZT0iI2QyZDRkNCIgc3Ryb2tlLXdpZHRoPSIyIi8+CjxwYXRoIGQ9Ik0yNiAyMmgxMnYxMkgyNlYyMnoiIGZpbGw9IiM5Mjk2OTciLz4KPHBhdGggZD0iTTE4IDMwdjE0aDI4VjMwSDE4eiIgZmlsbD0iIzk5OWI5YSIvPgo8L3N2Zz4=" alt="无任务" width="64" height="64">
                        <p>暂无任务，添加一个新任务开始吧！</p>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 任务记录网站. 保留所有权利.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
